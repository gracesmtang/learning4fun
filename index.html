<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infant Play Guide</title>
<style>
:root{--pink:#f2654f;--soft:#fff3ea;--border:#f2d7c5;--gold:#ffd88a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fffaf2,#ffeae2);color:#2e2e2e}.container{max-width:1100px;margin:40px auto;padding:20px}.hero,.results{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:0 12px 30px #0001}h1{text-align:center;color:var(--pink);margin:0;font-size:clamp(2rem,4vw,3rem)}.subtitle{text-align:center;color:#666;margin:10px 0 22px}.current-age{text-align:center;background:#fff3c9;border:1px solid #efc86d;border-radius:14px;padding:16px;font-size:1.2rem;color:#5b4a2b;font-weight:bold}.current-age small{display:block;margin-top:6px;font-size:.9rem;font-weight:normal}.results{margin-top:24px;background:var(--soft);box-shadow:none}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.header h2{margin:0}.badge{padding:8px 14px;border-radius:999px;background:var(--gold);border:1px solid #efc86d;font-weight:bold;color:#5b4a2b}.selector{margin-top:24px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px}.selector label{display:block;font-weight:bold;margin-bottom:10px}.row{display:flex;gap:12px;flex-wrap:wrap}select,button{padding:11px;border:1px solid #d9c2b0;border-radius:10px;font-size:1rem}select{min-width:230px}button{background:var(--pink);color:#fff;border:0;cursor:pointer}.category{margin-top:26px}.category:first-child{margin-top:0}.category-title{color:var(--pink);margin:0 0 12px;font-size:1.3rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}.icon{font-size:2rem;margin-bottom:10px}.card h3{margin:0 0 10px;color:var(--pink);font-size:1.08rem}.card p{margin:0;line-height:1.6}.safety{margin-top:24px;padding:14px;background:#fff8dc;border:1px solid #efd98d;border-radius:12px;line-height:1.5;color:#604f20}@media(max-width:600px){.container{margin:15px 8px;padding:10px}.hero,.results{padding:22px 16px}select,button{width:100%}}
</style></head>
<body><main class="container"><section class="hero"><h1>Infant Play Guide</h1><p class="subtitle">Age-appropriate play ideas for Baby S</p><div id="currentAge" class="current-age"></div></section><section class="results"><div class="header"><h2>Suggested Activities</h2><div id="badge" class="badge"></div></div><div id="activities"></div><div class="selector"><label for="monthSelect">View an upcoming month:</label><div class="row"><select id="monthSelect"></select><button id="showMonth">Show Selected Month</button></div></div><div class="safety"><strong>Safety reminder:</strong> Always supervise play. Use large, baby-safe objects and keep small items, food, paper, scents, and water away from the mouth and eyes.</div></section></main>
<script>
const BIRTHDAY='2026-07-15';
const categories={
2:[['🧠 Cognitive · 認知',['Mirror recognition','Animal sounds','Red apple card match','Rattle disappears','Cause-and-effect rattle','Family photo connection','Body parts']],
['👁 Sensory · 感官刺激',['Tummy time 15 minutes','Balcony breeze','Bath splash kicks','Hard, soft, rough textures','Orange and mint scents','Beat tapping','Grass foot feel']],
['❤️ Emotional & Social · 情緒社交',['Clap song','Praise head lifts','Comfort first','Preference test','Imitation game','Name mirror emotions','Family sing-along']],
['🏃 Gross Motor · 大肌肉',['Reach for hanging toy','Supported standing','Roll induction','Kick a soft ball','Elbow prop','Park watch']],
['✋ Fine Motor · 細肌肉',['Two rattles','Hand transfer','Point to face','Animal sound button','Tear paper introduction','Family clap relay']]],
3:[['🧠 Cognitive · 認知智力',['Peekaboo with both hands','Point and name','Animal book sounds','Pop-up toy','Big and small bowls','Hide under cloth','Family photo quiz']],['👁 Sensory · 感官刺激',['Barefoot grass','Shallow sand tray','Water kick','Compare three sounds','Texture bag','Cinnamon and vanilla','After-rain park']],['❤️ Emotional & Social · 情商社交',['Brief separation','Stranger comfort','Emotion mirror','Rolling celebration','Mirror self','If You’re Happy','Family peekaboo']],['🏃 Gross Motor · 大肌肉',['Complete left-to-right roll','Complete right-to-left roll','Supported sit','Kick inflatable ball','Prone pivot','Supported stand','Park with varied ages']],['✋ Fine Motor · 細肌肉',['Two-hand ball','Hand transfer','Touch face parts','Goodnight Moon','Twinkle actions','Block pour','Watch craft']]],
4:[['🧠 Cognitive · 認知智力',['Object permanence','Name response','Music buttons','Book vs real','Orange and green colours','Body commands','Bedtime reading']],['👁 Sensory · 感官刺激',['Solids texture','Water pouring','Dig for animals','Kitchen sounds','Park grass sit','Three solids compare','Fallen leaves']],['❤️ Emotional & Social · 情商社交',['Name praise','Separation warning','Feeding gaze','Emotion book','Secure base','Expression preference','Extended family']],['🏃 Gross Motor · 大肌肉',['Cushion sit 30 seconds','Press-up tummy time','Quadruped preparation','Sitting twist','Sitting kick','First stand','First crawl try']],['✋ Fine Motor · 細肌肉',['Block transfer five times','Spoon explore','Board book flip','Dump from bowl','Peel and stick','More signal','Family finger song']]],
5:[['🧠 Cognitive · 認知智力',[['布下藏找自行掀 · Object permanence','Hide a ball under a cloth and let Baby S lift the cloth. Say, “Found it!”'],['動物聲配對 · Animal sound match','Show a dog card and say “Woof!” then a cat card and say “Meow!” Repeat each three times.'],['手勢模仿拍手揮 · Gesture imitation','Demonstrate clapping, wait for imitation, then demonstrate waving.'],['給我遊戲積木 · Give-me game','Give Baby S a large safe block, say “Give me!”, and wait for a return.'],['兩布藏找哪一個 · Two-cloth hiding','Hide a toy under cloth A or B and observe which one Baby S searches.'],['身體指令升級 · Body commands+','Use simple cues: “Clap! Raise! Shake head!” without forcing movement.'],['家人指認等BB指 · Family pointing','Point to family members, ask “Who is this?”, and wait for a gesture.']]],['👁 Sensory · 感官刺激',[['爬行隧道探索 · Crawl tunnel','Use a safe open tunnel with a toy at the exit. Never block Baby S or leave unattended.'],['濕沙盆黏感受 · Wet sand','Use clean child-safe wet sand and describe “sticky, cool, wet.” Keep it away from the mouth.'],['三種地面爬比較 · Three-surface crawl','Explore a firm floor, carpet, and play mat for short supervised periods.'],['打擊樂器三輪換 · Percussion rotation','Offer a xylophone, rattle, and drum one at a time for about 30 seconds each.'],['手指食物豆腐初探 · Finger-food intro','If developmentally ready and approved for solids, offer soft, appropriately sized tofu under constant supervision.'],['薑蒜廚房嗅覺 · Ginger-garlic scents','Keep ginger or garlic nearby without skin contact and stop if Baby S dislikes the smell.'],['噴水池腳踩 · Splash-pad feet','At a clean shallow splash area, hold Baby S securely and let feet touch cool water.']]],['❤️ Emotional & Social · 情商社交',[['認生正面引導 · Stranger guide','Let Baby S observe while the caregiver interacts first; never force contact.'],['門後分離遊戲 · Door separation','Hide behind a door for about five seconds, say “Mama’s here!”, and return promptly.'],['情緒即時命名 · Emotion labelling','Name expressions gently: “You’re happy!” or “Are you uncomfortable?”'],['安慰物毛絨被 · Security object','Offer one consistent, safe comfort object; keep it out of the sleep space.'],['讚賞爬行進步 · Crawl praise','Celebrate movement with “You crawled all the way!”'],['媽媽group同齡 · Same-age group','Attend a calm baby group and let Baby S observe or play alongside peers.'],['家庭晚飯參與 · Family dinner','Seat Baby S securely in a high chair and include them in family interaction.']]],['🏃 Gross Motor · 大肌肉',[['玩具前方誘爬 · Crawl lure','Place a toy ahead and gradually move it a few centimetres farther.'],['扶站30–45秒 · Supported stand','Support Baby S at a stable surface for 30–45 seconds; do not force standing.'],['枕頭障礙爬越 · Pillow obstacle','Use soft, low cushions as obstacles and remain within arm’s reach.'],['追球爬行遊戲 · Chase ball crawl','Roll a soft ball slowly and encourage Baby S to crawl after it.'],['低沙發攀爬嘗試 · Sofa climb','Use only a stable, low surface with an adult directly beside Baby S.'],['站立輕晃平衡 · Balance sway','While fully supporting standing, make only gentle movements and stop if unsteady.'],['公園草地自由爬 · Outdoor free crawl','Explore clean grass on a safe mat or blanket with close supervision.']]],['✋ Fine Motor · 細肌肉',[['疊2塊積木 · Stack two blocks','Demonstrate stacking two large soft blocks and let Baby S try.'],['小物入廣口瓶 · Drop into jar','Use only large baby-safe objects and a wide container; never use choking-size beans.'],['大貼紙撕下 · Peel large sticker','Offer one large non-toxic sticker and supervise closely.'],['翻書2–3頁問 · Flip book Q&A','Turn two or three sturdy pages and ask “What’s this?”'],['匙羹舀軟食物 · Spoon scooping','If ready for solids, guide a baby-safe spoon through soft food.'],['揮手拜拜 · Wave bye-bye','Wave when family leaves and say “Bye-bye!”'],['全家手勢遊戲 · Family gestures','Model waving, clapping, and blowing kisses for Baby S to copy.']]]]
};
const descriptions={2:'Gentle sensory, bonding, and early movement play.',3:'Peekaboo, sounds, emotions, rolling, and hand exploration.',4:'Object permanence, textures, supported sitting, and communication.',5:'Hide-and-find, imitation, crawling, sensory play, and early gestures.'};
function ageMonths(){const b=new Date(BIRTHDAY+'T00:00:00'),t=new Date();let n=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth();if(t.getDate()<b.getDate())n--;return Math.max(0,n)}
function monthLabel(n){const d=new Date(2026,6+n,15);return `${n} months (${d.toLocaleString('en-US',{month:'long'})})`}
function plan(n){return categories[n]||[['🌱 Age-appropriate play · 適齡遊戲',[[`✨ ${monthLabel(n)}`,descriptions[n]||'Offer gentle, supervised play and follow Baby S’s interests.'],['🤗 Bonding and communication','Talk, sing, smile, and respond warmly to Baby S.'],['🧸 Safe exploration','Offer large, safe objects and stop when Baby S is tired.']]]]} 
function render(n){const root=document.getElementById('activities');root.innerHTML='';plan(n).forEach(([name,items])=>{const section=document.createElement('section');section.className='category';const h=document.createElement('h3');h.className='category-title';h.textContent=name;section.append(h);const grid=document.createElement('div');grid.className='cards';items.forEach(item=>{const icon=Array.isArray(item)?'✨':'✨',title=Array.isArray(item)?item[0]:item,desc=Array.isArray(item)?item[1]:'Try this activity with Baby S in a safe, supervised setting.';const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="icon">${icon}</div><h3></h3><p></p>`;card.querySelector('h3').textContent=title;card.querySelector('p').textContent=desc;grid.append(card)});section.append(grid);root.append(section)});document.getElementById('badge').textContent=monthLabel(n)}
const current=ageMonths();document.getElementById('currentAge').innerHTML=`Baby S is currently <strong>${monthLabel(current)}</strong><small>Birthday: July 15, 2026 · Age calculated automatically from today’s date</small>`;render(current);
const select=document.getElementById('monthSelect');[2,3,4,5,6,9,12,18,24].forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=monthLabel(n);select.append(o)});select.value=String([2,3,4,5,6,9,12,18,24].includes(current)?current:2);document.getElementById('showMonth').onclick=()=>render(Number(select.value));
</script></body></html>
