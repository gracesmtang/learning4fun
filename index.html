<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infant Play Guide</title>
  <style>
    :root{--bg1:#fffaf2;--bg2:#ffeae2;--primary:#f2654f;--soft:#fff3ea;--border:#f2d7c5;--text:#2e2e2e;--muted:#666;--gold:#ffd88a;--gold-border:#efc86d}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text)}
    .container{max-width:1100px;margin:40px auto;padding:20px}.hero,.results{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:28px 24px}
    h1{margin:0;text-align:center;color:var(--primary);font-size:clamp(2rem,4vw,3rem)}.subtitle{text-align:center;color:var(--muted);margin:10px 0 22px;font-size:1.05rem}
    .current-age{text-align:center;background:#fff3c9;border:1px solid var(--gold-border);border-radius:14px;padding:16px;font-size:1.2rem;font-weight:bold;color:#5b4a2b}.current-age small{display:block;margin-top:6px;font-size:.9rem;font-weight:normal}
    .results{margin-top:24px;background:var(--soft);box-shadow:none}.results-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}h2{margin:0;font-size:clamp(1.5rem,2vw,2rem)}.age-badge{padding:8px 14px;border-radius:999px;background:var(--gold);border:1px solid var(--gold-border);font-weight:bold;color:#5b4a2b}
    .selector-wrap{margin-top:18px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px}.selector-wrap label{font-weight:700;display:block;margin-bottom:12px}.selector-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.select-box{padding:10px 12px;border:1px solid #d9c2b0;border-radius:10px;font-size:1rem;min-width:200px}.action-btn{padding:11px 18px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:1rem;cursor:pointer} .action-btn:hover{background:#de584a}
    .category{margin-top:26px}.category:first-child{margin-top:0}.category-title{color:var(--primary);margin:0 0 12px;font-size:1.35rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 8px 18px rgba(0,0,0,.03)}.icon{font-size:2rem;margin-bottom:10px}.card h3{margin:0 0 10px;color:var(--primary);font-size:1.1rem}.card p{margin:0;line-height:1.6}.safety{margin-top:24px;padding:14px 16px;background:#fff8dc;border:1px solid #efd98d;border-radius:12px;line-height:1.5;color:#604f20}@media(max-width:600px){.container{margin:15px 8px;padding:10px}.hero,.results{padding:22px 16px}.selector-row{display:block}.select-box,.action-btn{width:100%}}
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>Infant Play Guide</h1>
      <p class="subtitle">Age-appropriate play ideas for Baby S</p>
      <div id="currentAge" class="current-age"></div>
    </section>

    <section class="results">
      <div class="results-header">
        <h2>Suggested Activities</h2>
        <div id="ageBadge" class="age-badge"></div>
      </div>

      <div id="activities"></div>

      <div class="selector-wrap">
        <label for="futureMonth">View upcoming month:</label>
        <div class="selector-row">
          <select id="futureMonth" class="select-box"></select>
          <button id="showMonthBtn" class="action-btn" type="button">Show Selected Month</button>
        </div>
      </div>

      <div class="safety"><strong>Safety reminder:</strong> Always supervise play. Keep small objects, paper, bubbles, and scents away from the mouth and eyes. Stop any activity if Baby S seems uncomfortable.</div>
    </section>
  </main>

  <script>
    const BABY_BIRTHDAY = "2026-07-15";

    const monthTwoCategories = [
      {name:"🧠 Cognitive · 認知",items:[["🪞","Mirror Recognition · 鏡子認識初探","Hold Baby S safely near a mirror and say, 'Who is that? It’s you!' Encourage eye contact and gentle smiling."],["🐄","Three Animal Sounds · 動物三聲音","Make three simple sounds—cow moo, cat meow, and dog woof—repeating each a few times."],["🍎","Red Apple Card Match · 紅蘋果卡配物","Show a red apple card beside a real apple and say, 'Same! Red!' Keep the object large and supervised."],["🔔","Rattle Disappears · 鈴聲再現","Shake a rattle, hide it briefly, ask 'Where?', then reveal it and say, 'Here it is!'"],["🤲","Cause-and-Effect Rattle · 因果鈴遞手","Shake the rattle for Baby S to hear, then offer it so they can try holding or shaking it."],["👨‍👩‍👧","Family Photo Connection · 家庭關係","Point to a family photo and name people, such as 'Daddy loves you.'"],["👶","Body Parts · 身體部位","Gently touch and name body parts: head, shoulders, tummy, hands, and feet."]]},
      {name:"👁 Sensory · 感官刺激",items:[["🤸","Tummy Time 15 Minutes · TT 15計","Offer supervised tummy time on a firm mat in short, comfortable periods that total about 15 minutes. Lie facing Baby S to encourage them."],["🍃","Balcony Breeze · 陽台微風感受","With Baby S held securely, feel a gentle breeze and say, 'Cool! Breezy! Fresh!' Avoid direct sun and strong wind."],["💦","Bath Splash Kicks · 洗踢水濺水","During a closely supervised bath, let Baby S gently kick the water and say, 'Kick! Splash!'"],["🧸","Hard, Soft, Rough Textures · 硬軟三質感","Briefly present a large hard block, soft plush toy, and textured cloth. Do not let Baby S mouth unsafe items."],["🍊","Orange and Mint Scents · 橙皮薄荷香","Keep orange peel or mint near—not touching—Baby S's nose for about three seconds. Stop if uncomfortable and avoid strong scents."],["🥁","Beat Tapping · 音節拍敲","Hold Baby S's hand gently and tap a table softly to music, saying, 'Tap, tap, tap!'"],["🌿","Grass Foot Feel · 草地腳踩","While holding Baby S securely, briefly let bare feet feel clean grass and describe it as soft or tickly."]]},
      {name:"❤️ Emotional & Social · 情緒社交",items:[["👏","Clap Song · 拍手歌遊戲","Gently hold Baby S's hands and clap together while singing a short clapping song."],["🌟","Praise Head Lifts · 讚賞抬頭嘗試","When Baby S lifts their head during tummy time, smile and say, 'You did it! Amazing!'"],["🤗","Comfort First · 先說再抱安","When Baby S cries, calmly say, 'Mama understands,' then provide a comforting cuddle."],["😄","Preference Test · 社交喜好測試","Try three gentle engagement styles—singing, smiling, and talking—and notice which gets the biggest response."],["🔁","Imitation Game · 模仿遊戲開始","If Baby S pats or makes a sound, copy it gently. This teaches turn-taking and connection."],["🙂","Name Mirror Emotions · 鏡緒命名","In a mirror, make gentle happy, surprised, and calm expressions and name each feeling."],["🎼","Family Sing-Along · 全家大合唱","Invite family members to sing a favourite gentle song together."]]},
      {name:"🏃 Gross Motor · 大肌肉",items:[["🔔","Reach for Hanging Toy · 掛物伸手","Place a safe toy above Baby S's chest, within comfortable reach, and encourage reaching. Never leave a hanging toy unattended."],["🦵","Supported Standing · 扶腋下腿踩站","With full support under the arms, let Baby S's feet briefly touch your thighs for up to 15 seconds. Do not force standing."],["↔️","Roll Induction · 翻身誘導","Place Baby S on their side and use a toy on the opposite side to encourage looking and gentle rolling. Stop if frustrated."],["⚽","Kick a Soft Ball · 踢軟球","While Baby S lies on their back, place a soft ball near the feet and encourage gentle kicking."],["💪","Elbow Prop · 俯臥雙肘撐","During tummy time, encourage Baby S to prop on both elbows for a few seconds with close supervision."],["🟠","Slow Ball Side Roll · 大球左右慢動","Only with confident adult support, place Baby S prone on a large stable ball and make very slow side-to-side movements."],["🚗","Park Watch · 園看人看車","Take a stroller walk and talk about people, children, and vehicles from a safe distance."]]},
      {name:"✋ Fine Motor · 細肌肉",items:[["🔔","Two Rattles · 雙手各握鈴","Offer one lightweight, baby-safe rattle at a time to each hand and observe whether Baby S holds or moves both."],["🤲","Hand Transfer · 玩具左至右換手","Place a safe toy in the left hand, wait, and gently encourage Baby S to explore moving it toward the right hand."],["👃","Point to Face · 食指點鼻眼","With your guidance, gently touch and name nose, eyes, and mouth. Never poke or put fingers near the eyes."],["🔊","Animal Sound Button · 聲動物按鈕","Use a large, safe sound book or button and name the animal each time it sounds, such as 'Dog! Dog!'"],["📄","Tear Paper Introduction · 大紙撕開初探","Let Baby S explore tearing a large sheet of paper only with close supervision; remove every piece immediately."],["🫧","Pop Palm Bubbles · 手掌泡泡戳破","Blow bubbles toward an adult-held palm so Baby S can watch or touch them. Keep bubbles away from eyes and mouth."],["👏","Family Clap Relay · 家庭接力拍手","Take turns clapping—dad, mum, grandparent—and invite Baby S to watch and imitate."]]}
    ];

    const monthThreeCategories = [
      {name:"🧠 Cognitive · 認知智力",items:[["🙈","Peekaboo with Both Hands · Peekaboo雙手遮臉","Cover your face for about two seconds and say, 'Gone!' Then reappear with 'Boo!' Repeat up to five times."],["🪟","Point and Name · 指窗燈桌命名","Point to a window, light, and table. Name each object three times."],["📖","Animal Book Sounds · 動物圖書聲音","Look at an animal book and say, 'Dog—woof! Cat—meow! Bird—tweet!'"],["🎁","Pop-up Toy · 因果彈出玩具","Press a safe button so an animal pops up. Make a surprised face and say, 'Out came!'"],["🥣","Big and Small Bowls · 大小碗比較","Show a large and small bowl and say, 'Big! Small!' three times each."],["🧣","Hide Under Cloth · 布下藏找掀布","Hide a large safe toy under a cloth, ask, 'Where did it go?', and let Baby S uncover it."],["👨‍👩‍👧","Family Photo Quiz · 家庭相片問答","Point to four family photos and ask, 'Where's daddy? Where's mummy?' Respond warmly to any look or gesture."]]},
      {name:"👁 Sensory · 感官刺激",items:[["🌿","Barefoot Grass · 草地赤腳踩","At a clean park area, hold Baby S securely while bare feet briefly feel grass. Say, 'Soft! Cool! Tickly!'"],["🏖️","Shallow Sand Tray · 家用淺沙盤探索","Use a shallow tray with clean, child-safe sand for supervised finger exploration. Say, 'Sandy and rough!' Keep sand away from the mouth and eyes."],["💦","Water Kick · 水盤坐邊踢水","With constant support and supervision, let Baby S kick a very shallow basin of water and say, 'Cool! Splash!'"],["🎶","Compare Three Sounds · 三樂器比較聲音","Offer a rattle, wood block, and shaker one at a time. Make each sound five times and compare them."],["👜","Texture Bag · 感官布袋初探","Place a soft ball, large block, and plush item in a cloth bag. Guide Baby S's hands to explore; do not leave the bag unattended."],["🍂","Cinnamon and Vanilla · 肉桂香草廚房香","Keep cinnamon or vanilla nearby—but never touching skin—for about three seconds. Stop if uncomfortable and avoid strong scents."],["🌧️","After-Rain Park · 雨後公園泥土香","From a safe distance, notice the smell of damp soil and look at puddle reflections. Do not let Baby S touch dirty water."]]},
      {name:"❤️ Emotional & Social · 情商社交",items:[["👋","Brief Separation · 短暫離視線5秒","Step briefly out of sight for about five seconds, return promptly, and say, 'Mama's back!' Only do this if Baby S is calm."],["🤝","Stranger Comfort · 陌生人安撫語","Around an unfamiliar person, stay close and say, 'It's okay, friendly person!' Never force interaction."],["😢","Emotion Mirror · 情緒鏡像回應","If Baby S cries, calmly say, 'Are you sad? Mama understands,' then comfort them."],["🎉","Rolling Celebration · 翻身全家慶祝","When Baby S rolls, smile and clap gently while saying, 'You rolled! So amazing!'"],["🪞","Mirror Self · 鏡前自我靚靚","Hold Baby S near a safe mirror and say, 'It's you! Beautiful baby!'"],["👏","If You're Happy · 如果開心就拍手","Sing the song and gently guide simple clapping actions without forcing movement."],["🙈","Family Peekaboo · 全家Peekaboo","Have family members take turns playing peekaboo with different large, safe objects."]]},
      {name:"🏃 Gross Motor · 大肌肉",items:[["↪️","Complete Left-to-Right Roll · 左至右完整翻身","Place Baby S on the left side with a toy to the right. Wait and encourage a complete roll without pulling."],["↩️","Complete Right-to-Left Roll · 右至左完整翻身","Place Baby S on the right side with a toy to the left. Wait and encourage a complete roll without pulling."],["🪑","Supported Sit 60 Seconds · 扶坐60s頭平衡","Support Baby S at the waist in sitting for up to 60 seconds and observe head balance. Stop when tired."],["⚽","Kick Inflatable Ball · 仰臥踢大充氣球","While Baby S lies on their back, place a large soft inflatable ball near the feet and encourage kicking."],["🔄","Prone Pivot · 俯臥轉圈取物","During tummy time, place a safe toy to the side and encourage Baby S to pivot toward it."],["🧍","Supported Stand 30 Seconds · 扶站30s","Support Baby S under the arms for up to 30 seconds. Do not reduce support or force weight-bearing."],["🚶","Park with Varied Ages · 公園看不同年齡","Take a stroller walk and safely observe children of different ages playing nearby."]]},
      {name:"✋ Fine Motor · 細肌肉",items:[["⚽","Two-Hand Ball · 雙手抓大軟球","Place a large soft ball between Baby S's hands and let fingers wrap around it with supervision."],["🤲","Hand Transfer · 玩具左至右換手","Place a toy in the left hand and gently encourage moving it toward the right hand."],["👃","Touch Face Parts · 食指點鼻眼嘴耳","With guidance, gently name and touch nose, eyes, mouth, and ears. Never poke near the eyes."],["🌙","Goodnight Moon · 晚安月亮睡前","Read a sturdy picture book and name one object on each page, such as moon and stars."],["✨","Twinkle Actions · 一閃小星星動作","Sing Twinkle Twinkle and demonstrate gentle finger movements for Baby S to watch."],["📦","Block Pour · 積木容器倒入","With large baby-safe blocks, move them from one wide container to another and say, 'In! Pour!'"],["🧶","Watch Craft · 媽媽手工觀看","Let Baby S watch and briefly touch only large, safe craft materials while you hold them. Keep tools, string, and scraps away."]]} 
    ];

    const monthPlans = {
      2: { label: "Month 2", categories: monthTwoCategories },
      3: { label: "Month 3", categories: monthThreeCategories },
      4: { label: "Month 4", categories: [{name:"🧠 Cognitive",items:[["🧩","Object permanence games","Hide a toy and gently encourage looking for it with large, easy-to-find objects."],["🔊","Name sounds and objects","Repeat key words like 'ball', 'dog', and 'book' while pointing to them."],["📷","Picture recognition","Look at family photos and name each person with warmth and repetition."]]},{name:"👁 Sensory",items:[["🧺","Sensory basket","Add large fabric squares, balls, and textured cloths for gentle exploring."],["💦","Bath play","Use a shallow basin and encourage splashing while staying supervised."],["🌼","Outdoor sound walk","Sit outside and notice wind, birds, and sunlight."]]},{name:"❤️ Emotional & Social",items:[["😄","Smile exchange","Pause and wait for Baby S to smile back, then celebrate."],["👋","Wave and clap","Use a simple wave and clap song to build social interaction."],["🤝","Hold and soothe","Respond with eye contact and warm touch when Baby S is upset."]]},{name:"🏃 Gross Motor",items:[["🧍","Supported standing","Hold under the arms and allow brief standing with weight on feet."],["🧿","Reach and grab","Place a safe toy in front and encourage grabbing and reaching."],["🔁","Tummy time rotation","Turn the toy to each side and encourage turning the head toward it."]]},{name:"✋ Fine Motor",items:[["🧸","Hold a soft toy","Offer a properly sized soft toy and help Baby S hold it."],["🫙","Container play","Let Baby S touch and press a large plastic container with a lid."],["🧵","Gentle hand opening","Open and close one hand with a soft toy in between toy and palm."]]}]},
      5: { label: "Month 5", categories: [{name:"🧠 Cognitive",items:[["📚","Board book time","Read simple books with large pictures and name one object on each page."],["🧩","Pattern play","Offer two contrasting objects and repeat the same pattern gently."],["🎲","Cause and effect","Try pressing a toy or touching a switch and respond with excitement."]]},{name:"👁 Sensory",items:[["🪵","Texture tray","Explore rough, smooth, and soft textures with supervision."],["🏖️","Water play","Use a shallow tray and let Baby S splash with assistance."],["🍋","Scent play","Briefly expose mild scents like lemon peel or vanilla and stop if uncomfortable."]]},{name:"❤️ Emotional & Social",items:[["🎵","Music and songs","Sing familiar songs and pause for Baby S to vocalize or smile."],["👀","Face-to-face eye contact","Hold Baby S close and talk softly during transitions."],["🤗","Comfort routines","Use the same words and motions for calming and feeding routines."]]},{name:"🏃 Gross Motor",items:[["🚶","Supported sitting","Practice sitting with support and gentle repositioning."],["🪀","Roll toy chase","Place a toy to one side to encourage rolling toward it."],["💪","Elbow tummy time","Support propping on elbows for a few seconds during tummy time."]]},{name:"✋ Fine Motor",items:[["🧱","Stacking blocks","Stack soft blocks and show knocking them down together."],["📦","Drop and pick up","Drop large toys into a container and retrieve them with help."],["🧤","Sock pull","Offer soft socks to pull and explore with hands."]]}]},
      6: { label: "Month 6", categories: [{name:"🧠 Cognitive",items:[["🧩","Object permanence","Hide a toy under a cloth and let Baby S find it."],["📦","Name household items","Point to big items like cup, spoon, and book while naming them."],["🔊","Animal sounds","Repeat animal noises and encourage listening and imitation." ]]},{name:"👁 Sensory",items:[["🎵","Noise and rhythm","Use shakers and gentle drums for sound play."],["🌱","Grass and sand touch","Allow safe, supervised exploration of grass and dry sand."],["🧺","Sensory bins","Introduce safe textured items inside a supervised basket."]]},{name:"❤️ Emotional & Social",items:[["👩‍👩‍👧","Turn-taking play","Take turns making sounds, smiling, and tapping together."],["📸","Family photo recognition","Point to familiar people and say their names."],["🤝","Simple comfort language","Use calm repeated phrases such as 'It's okay, I'm here.'"]]},{name:"🏃 Gross Motor",items:[["🧍","Standing with support","Practice brief standing and weight-bearing with support."],["🚴","Muscle push play","Encourage reaching and pushing against your hands or a cushion."],["💥","Rolling games","Offer toys to the side to encourage rolling in either direction."]]},{name:"✋ Fine Motor",items:[["🧱","Block tower","Stack large blocks and knock them down together."],["📄","Paper tearing","Offer big paper with close supervision and easy cleanup."],["🧤","Finger play","Use songs where fingers open and close together."]]}]},
      9: { label: "Month 9", categories: [{name:"🧠 Cognitive",items:[["🔍","Hide-and-seek toys","Hide toys in plain sight and ask 'where is it?'"],["📚","Picture naming","Name pictures during book time and ask simple questions."],["🧩","Cause and effect","Press buttons and repeat the result with excitement."]]},{name:"👁 Sensory",items:[["🎵","Music play","Use rhythm instruments and encourage clapping."],["🏖️","Water basin","Let Baby S kick and splash in a shallow supervised basin."],["🧸","Texture basket","Offer varied items such as sponge, plush, and fabric."]]},{name:"❤️ Emotional & Social",items:[["🎉","Imitation games","Copy Baby S's sounds and actions to build connection."],["👀","Mirror joy","Look in the mirror and point to the face with happy words."],["🤗","Routine soothing","Say familiar comfort words and repeat routines."]]},{name:"🏃 Gross Motor",items:[["🧍","Cruising support","Offer support near furniture to encourage standing and weight shift."],["⚽","Kick a ball","Practice rolling and kicking a soft ball."],["🧭","Reach and crawl","Place toys just out of reach to encourage crawling."]]},{name:"✋ Fine Motor",items:[["🧱","Stacking soft blocks","Stack and knock down soft blocks."],["🧺","Scoop and pour","Use a wide scoop and container to pour small items."],["📏","Point and touch","Use index finger to touch nose, ears, and mouth."]]}]},
      12: { label: "Month 12", categories: [{name:"🧠 Cognitive",items:[["🧩","Simple puzzles","Use big wooden or foam pieces and encourage matching."],["📚","Book questions","Ask where things are and point to pictures in books."],["🎲","Shape sorting","Sort big shapes or colors in simple games."]]},{name:"👁 Sensory",items:[["🎵","Instrument play","Offer drums, shakers, and rattles with supervision."],["🌿","Texture walk","Touch grass, sand, and safe outdoor textures."],["💦","Bubbles","Bubble play from a safe distance with close monitoring."]]},{name:"❤️ Emotional & Social",items:[["🗣️","Simple language","Use short sentences with clear names for people and objects."],["😄","Turn-taking games","Take turns with clapping and sounds."],["🤝","Family routines","Use predictable family rituals and songs."]]},{name:"🏃 Gross Motor",items:[["🚶","Walking practice","Offer support while Baby S explores standing and walking."],["🏐","Throw and roll","Roll a ball together and encourage reaching and throwing."],["🧠","Obstacle crawl","Make a simple route with soft pillows under supervision."]]},{name:"✋ Fine Motor",items:[["🧱","Stacking taller towers","Build with larger pieces and enjoy knocking them down."],["📦","Pour and fill","Pour from one container to another with help."],["🧵","Finger threading","Use large, safe threading objects under supervision."]]}]},
      18: { label: "Month 18", categories: [{name:"🧠 Cognitive",items:[["🎯","Simple sorting","Sort by color or category with large objects."],["📚","Story time","Name pictures in story books and ask where items are."],["🔢","Counting fun","Clap and count to three with simple repetition."]]},{name:"👁 Sensory",items:[["🎶","Music and movement","Use rhythm songs and dancing patterns."],["🎒","Sensory backpack","Explore with fabric pieces and safe soft items."],["🪴","Nature touch","Look at leaves, flowers, and textured outdoor objects."]]},{name:"❤️ Emotional & Social",items:[["🗣️","Simple conversation","Talk about daily routines and ask about pictures."],["😊","Play pretend","Pretend to feed a doll or stuffed animal."]]},{name:"🏃 Gross Motor",items:[["🚲","Push toy play","Push and pull safe toys while walking."],["🏃","Climb with support","Offer a stable stepping stool or couch support under supervision."],["⚽","Ball games","Kick and throw soft balls together."]]},{name:"✋ Fine Motor",items:[["🧩","Larger puzzles","Complete big shape puzzles with help."],["🪀","Simple cause and effect toys","Press buttons and twist knobs with supervision."],["📦","Container fill and dump","Fill and empty wide containers repeatedly."]]}]},
      24: { label: "Month 24", categories: [{name:"🧠 Cognitive",items:[["🧩","Shape matching","Match big shapes, colors, and objects together."],["📖","Story retell","Ask Baby S to point to familiar animals or objects in books."],["🔢","Count together","Count to 2 or 3 while clapping or pointing to objects."]]},{name:"👁 Sensory",items:[["🧪","Safe sensory bins","Explore grains, water, or large items under supervision."],["🌳","Nature sensory day","Touch leaves, grass, and safe outdoor objects."],["🎵","Sound scavenger hunt","Listen for sounds outdoors and react with joy."]]},{name:"❤️ Emotional & Social",items:[["🗣️","Follow simple instructions","Ask to bring a toy or book and celebrate."],["🧸","Pretend play","Role-play with dolls and animals."],["🎉","Social games","Take turns and enjoy simple group reactions."]]},{name:"🏃 Gross Motor",items:[["⚽","Kick and throw","Play ball games and encourage active movement."],["🧍","Running games","Support safe running and obstacle play."],["🚶","Wider walking","Encourage walking in safe open spaces."]]},{name:"✋ Fine Motor",items:[["🧱","Block tower building","Build taller towers and knock them down."],["🧩","Larger puzzles","Use bigger pieces and more complex shape matching."],["🧴","Small object sorting","Sort large safe items by type or color."]]}]}
    };

    function calculateAgeInMonths(dateString){const birth=new Date(`${dateString}T00:00:00`),today=new Date();let months=(today.getFullYear()-birth.getFullYear())*12+today.getMonth()-birth.getMonth();if(today.getDate()<birth.getDate())months--;return Math.max(0,months)}
    function cardGrid(items){const grid=document.createElement('div');grid.className='cards';items.forEach(item=>{const [icon,title,description]=Array.isArray(item)?item:[item.icon,item.title,item.description];const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="icon">${icon}</div><h3></h3><p></p>`;card.querySelector('h3').textContent=title;card.querySelector('p').textContent=description;grid.appendChild(card)});return grid}
    function renderPlan(plan){const container=document.getElementById('activities');container.innerHTML='';if(plan.categories){plan.categories.forEach(category=>{const section=document.createElement('section');section.className='category';const heading=document.createElement('h3');heading.className='category-title';heading.textContent=category.name;section.appendChild(heading);section.appendChild(cardGrid(category.items));container.appendChild(section)})}else{container.appendChild(cardGrid(plan.items))}}

    const ageInMonths = calculateAgeInMonths(BABY_BIRTHDAY);
    document.getElementById('currentAge').innerHTML = `Baby S is currently <strong>${ageInMonths} month${ageInMonths===1?'':'s'} old</strong><small>Birthday: July 15, 2026 · Age is calculated automatically from today's date</small>`;
    document.getElementById('ageBadge').textContent = `${ageInMonths} months`;

    const firstVisibleMonth = ageInMonths === 2 ? 2 : (ageInMonths === 3 ? 3 : (ageInMonths >= 4 ? ageInMonths : 2));
    const defaultPlan = monthPlans[firstVisibleMonth] || monthPlans[2];
    renderPlan(defaultPlan);

    const select = document.getElementById('futureMonth');
    const months = [2,3,4,5,6,9,12,18,24];
    months.forEach(month => {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = `Month ${month}`;
      select.appendChild(option);
    });
    select.value = String(firstVisibleMonth);

    document.getElementById('showMonthBtn').addEventListener('click', () => {
      const selected = Number(select.value);
      const plan = monthPlans[selected] || monthPlans[ageInMonths || 2];
      renderPlan(plan);
      document.getElementById('ageBadge').textContent = plan.label || `${selected} months`;
    });
  </script>
</body>
</html>
