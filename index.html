<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Infant Play Guide</title>
<style>
:root{--bg:#fffaf2;--pink:#f2654f;--soft:#fff3ea;--border:#f2d7c5;--text:#2e2e2e;--muted:#666;--gold:#ffd88a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--bg),#ffeae2);color:var(--text)}.container{max-width:1100px;margin:40px auto;padding:20px}.hero,.results{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:0 12px 30px #00000014}h1{text-align:center;color:var(--pink);margin:0;font-size:clamp(2rem,4vw,3rem)}.subtitle{text-align:center;color:var(--muted);margin:10px 0 22px}.current-age{text-align:center;background:#fff3c9;border:1px solid #efc86d;border-radius:14px;padding:16px;font-size:1.2rem;color:#5b4a2b;font-weight:bold}.current-age small{display:block;margin-top:6px;font-size:.9rem;font-weight:normal}.results{margin-top:24px;background:var(--soft);box-shadow:none}.results-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.results-header h2{margin:0}.age-badge{padding:8px 14px;border-radius:999px;background:var(--gold);border:1px solid #efc86d;font-weight:bold;color:#5b4a2b}.selector-wrap{margin-top:24px;padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px}.selector-wrap label{display:block;font-weight:bold;margin-bottom:10px}.selector-row{display:flex;gap:12px;flex-wrap:wrap}.select-box{padding:11px;border:1px solid #d9c2b0;border-radius:10px;font-size:1rem;min-width:230px}.action-btn{padding:11px 18px;border:0;border-radius:10px;background:var(--pink);color:#fff;font-size:1rem;cursor:pointer}.category{margin-top:26px}.category:first-child{margin-top:0}.category-title{color:var(--pink);margin:0 0 12px;font-size:1.3rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}.icon{font-size:2rem;margin-bottom:10px}.card h3{margin:0 0 10px;color:var(--pink);font-size:1.08rem}.card p{margin:0;line-height:1.6}.safety{margin-top:24px;padding:14px;background:#fff8dc;border:1px solid #efd98d;border-radius:12px;line-height:1.5;color:#604f20}@media(max-width:600px){.container{margin:15px 8px;padding:10px}.hero,.results{padding:22px 16px}.select-box,.action-btn{width:100%}}
</style>
</head>
<body><main class="container"><section class="hero"><h1>Infant Play Guide</h1><p class="subtitle">Age-appropriate play ideas for Baby S</p><div id="currentAge" class="current-age"></div></section><section class="results"><div class="results-header"><h2 id="resultsTitle">Suggested Activities</h2><div id="ageBadge" class="age-badge"></div></div><div id="activities"></div><div class="selector-wrap"><label for="futureMonth">View an upcoming month:</label><div class="selector-row"><select id="futureMonth" class="select-box"></select><button id="showMonthBtn" class="action-btn">Show Selected Month</button></div></div><div class="safety"><strong>Safety reminder:</strong> Always supervise play. Keep small objects, paper, bubbles, and scents away from the mouth and eyes.</div></section></main>
<script>
const BABY_BIRTHDAY="2026-07-15";
const plans={
2:[['🧠 Cognitive · 認知',[['🪞','Mirror Recognition · 鏡子認識初探','Hold Baby S safely near a mirror and say, “Who is that? It’s you!”'],['🐄','Three Animal Sounds · 動物三聲音','Make cow, cat, and dog sounds, repeating each a few times.'],['🍎','Red Apple Card Match · 紅蘋果卡配物','Show a red apple card beside a real apple and say, “Same! Red!”'],['🔔','Rattle Disappears · 鈴聲再現','Shake, hide briefly, ask “Where?”, then reveal it: “Here!”'],['🤲','Cause-and-Effect Rattle · 因果鈴遞手','Shake a safe rattle, then offer it for Baby S to hold or shake.'],['👨‍👩‍👧','Family Photo Connection · 家庭關係','Point to family photos and name familiar people.'],['👶','Body Parts · 身體部位','Gently touch and name head, shoulders, tummy, hands, and feet.']]],['👁 Sensory · 感官刺激',[['🤸','Tummy Time 15 Minutes · TT 15計','Offer supervised tummy time on a firm mat in short comfortable periods.'],['🍃','Balcony Breeze · 陽台微風感受','Hold Baby S securely in a gentle breeze and say “Cool! Breezy!”'],['💦','Bath Splash Kicks · 洗踢水濺水','During a closely supervised bath, let Baby S gently kick and splash.'],['🧸','Hard, Soft, Rough Textures · 硬軟三質感','Briefly offer large hard, soft, and textured items; do not allow mouthing unsafe items.'],['🍊','Orange and Mint Scents · 橙皮薄荷香','Keep mild scents nearby, never touching skin, for about three seconds.'],['🥁','Beat Tapping · 音節拍敲','Gently hold Baby S’s hand and tap softly to music.'],['🌿','Grass Foot Feel · 草地腳踩','Hold Baby S securely while feet briefly feel clean grass.']]],['❤️ Emotional & Social · 情緒社交',[['👏','Clap Song · 拍手歌遊戲','Gently hold Baby S’s hands and clap together while singing.'],['🌟','Praise Head Lifts · 讚賞抬頭嘗試','Celebrate head lifts during tummy time: “You did it!”'],['🤗','Comfort First · 先說再抱安','Say “Mama understands,” then provide a comforting cuddle when Baby S cries.'],['😄','Preference Test · 社交喜好測試','Try singing, smiling, and talking; notice the strongest response.'],['🔁','Imitation Game · 模仿遊戲開始','Copy Baby S’s pats or sounds to build turn-taking.'],['🙂','Name Mirror Emotions · 鏡緒命名','Make happy, surprised, and calm expressions and name them.'],['🎼','Family Sing-Along · 全家大合唱','Sing a favourite gentle song together.']]],['🏃 Gross Motor · 大肌肉',[['🔔','Reach for Hanging Toy · 掛物伸手','Offer a safe toy above the chest and supervise continuously.'],['🦵','Supported Standing · 扶腋下腿踩站','Fully support under the arms for a brief supported stand; never force it.'],['↔️','Roll Induction · 翻身誘導','Place a toy to the side and encourage gentle rolling without pulling.'],['⚽','Kick a Soft Ball · 踢軟球','Place a soft ball near the feet and encourage kicking.'],['💪','Elbow Prop · 俯臥雙肘撐','Encourage brief elbow propping during supervised tummy time.'],['🚗','Park Watch · 園看人看車','Take a stroller walk and watch people and vehicles safely.']]],['✋ Fine Motor · 細肌肉',[['🔔','Two Rattles · 雙手各握鈴','Offer lightweight baby-safe rattles with close supervision.'],['🤲','Hand Transfer · 玩具左至右換手','Encourage moving a safe toy from left hand toward right hand.'],['👃','Point to Face · 食指點鼻眼','Gently name nose, eyes, and mouth; never poke near the eyes.'],['🔊','Animal Sound Button · 聲動物按鈕','Use a large safe sound book and name each animal.'],['📄','Tear Paper Introduction · 大紙撕開初探','Explore large paper only under close supervision and remove pieces immediately.'],['👏','Family Clap Relay · 家庭接力拍手','Family members take turns clapping for Baby S to watch and imitate.']]]],
3:[['🧠 Cognitive · 認知智力',[['🙈','Peekaboo with Both Hands · Peekaboo雙手遮臉','Cover your face for two seconds, say “Gone!”, then reappear with “Boo!”'],['🪟','Point and Name · 指窗燈桌命名','Point to a window, light, and table and name each three times.'],['📖','Animal Book Sounds · 動物圖書聲音','Say “Dog—woof! Cat—meow! Bird—tweet!” while looking at a book.'],['🎁','Pop-up Toy · 因果彈出玩具','Press a safe button so an animal pops up and say “Out came!”'],['🥣','Big and Small Bowls · 大小碗比較','Show large and small bowls and say “Big! Small!”'],['🧣','Hide Under Cloth · 布下藏找掀布','Hide a large safe toy and let Baby S uncover it.'],['👨‍👩‍👧','Family Photo Quiz · 家庭相片問答','Point to family photos and ask “Where’s daddy?”']]],['👁 Sensory · 感官刺激',[['🌿','Barefoot Grass · 草地赤腳踩','Hold Baby S securely while feet briefly feel clean grass.'],['🏖️','Shallow Sand Tray · 家用淺沙盤探索','Use clean child-safe sand for supervised finger exploration.'],['💦','Water Kick · 水盤坐邊踢水','With constant support, let Baby S kick a very shallow basin of water.'],['🎶','Compare Three Sounds · 三樂器比較聲音','Offer a rattle, wood block, and shaker one at a time.'],['👜','Texture Bag · 感官布袋初探','Use a cloth bag with large soft items; never leave it unattended.'],['🍂','Cinnamon and Vanilla · 肉桂香草廚房香','Keep mild scents nearby, never touching skin, for about three seconds.'],['🌧️','After-Rain Park · 雨後公園泥土香','Notice damp soil and puddle reflections from a safe distance.']]],['❤️ Emotional & Social · 情商社交',[['👋','Brief Separation · 短暫離視線5秒','Step out of sight briefly, return promptly, and say “Mama’s back!”'],['🤝','Stranger Comfort · 陌生人安撫語','Stay close around strangers and reassure Baby S without forcing interaction.'],['😢','Emotion Mirror · 情緒鏡像回應','Say “Are you sad? Mama understands,” then comfort Baby S.'],['🎉','Rolling Celebration · 翻身全家慶祝','Celebrate rolling with gentle clapping.'],['🪞','Mirror Self · 鏡前自我靚靚','Use a safe mirror and say “It’s you! Beautiful baby!”'],['👏','If You’re Happy · 如果開心就拍手','Sing and gently guide simple clapping actions.'],['🙈','Family Peekaboo · 全家Peekaboo','Take turns playing peekaboo with large safe objects.']]],['🏃 Gross Motor · 大肌肉',[['↪️','Complete Left-to-Right Roll · 左至右完整翻身','Place a toy to the right and wait for a gentle complete roll without pulling.'],['↩️','Complete Right-to-Left Roll · 右至左完整翻身','Place a toy to the left and wait for a gentle complete roll.'],['🪑','Supported Sit · 扶坐頭平衡','Support Baby S at the waist and observe head balance.'],['⚽','Kick Inflatable Ball · 仰臥踢大充氣球','Place a large soft inflatable ball near the feet and encourage kicking.'],['🔄','Prone Pivot · 俯臥轉圈取物','Place a safe toy to the side during tummy time and encourage pivoting.'],['🧍','Supported Stand · 扶站','Support under the arms briefly; never force weight-bearing.'],['🚶','Park with Varied Ages · 公園看不同年齡','Observe children of different ages from a safe stroller distance.']]],['✋ Fine Motor · 細肌肉',[['⚽','Two-Hand Ball · 雙手抓大軟球','Place a large soft ball between Baby S’s hands under supervision.'],['🤲','Hand Transfer · 玩具左至右換手','Encourage moving a toy from left hand toward right hand.'],['👃','Touch Face Parts · 食指點鼻眼嘴耳','Gently name nose, eyes, mouth, and ears; never poke the eyes.'],['🌙','Goodnight Moon · 晚安月亮睡前','Read a sturdy picture book and name an object on each page.'],['✨','Twinkle Actions · 一閃小星星動作','Sing Twinkle Twinkle and demonstrate gentle finger movements.'],['📦','Block Pour · 積木容器倒入','Move large baby-safe blocks between wide containers.'],['🧶','Watch Craft · 媽媽手工觀看','Watch safe crafting together; keep tools, string, and scraps away.']]]]
};
const generic={4:'Explore object permanence, sensory textures, music, supported sitting, reaching, and safe hand-to-hand toy transfers.',5:'Enjoy board books, cause-and-effect toys, supervised textures, supported sitting, and simple stacking.',6:'Try hide-and-seek toys, name household objects, make animal sounds, explore rhythms, and practise supported movement.',9:'Play hide-and-seek, name pictures, clap to music, crawl toward toys, stack blocks, and practise turn-taking.',12:'Try simple puzzles, picture books, shape sorting, walking games, ball play, and pretend play.',18:'Sort colours and shapes, read stories, dance, use push toys, play pretend, and practise simple instructions.',24:'Match shapes, retell picture stories, count together, play ball, build towers, and sort large safe objects.'};
function calculateAgeInMonths(date){const b=new Date(date+'T00:00:00'),t=new Date();let m=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth();if(t.getDate()<b.getDate())m--;return Math.max(0,m)}
function genericPlan(month){const text=generic[month]||generic[24];return[['🌱 Age-appropriate play · 適齡遊戲',[['✨','Play ideas for '+month+' months',text],['🤗','Bonding and communication','Talk, sing, smile, and respond warmly to Baby S’s sounds and gestures.'],['🧸','Supervised exploration','Offer large, safe objects and follow Baby S’s interest at a comfortable pace.']]]]} 
function planFor(month){return plans[month]||genericPlan(month)}
function render(month){const plan=planFor(month),root=document.getElementById('activities');root.innerHTML='';plan.forEach(([name,items])=>{const section=document.createElement('section');section.className='category';const h=document.createElement('h3');h.className='category-title';h.textContent=name;section.append(h);const grid=document.createElement('div');grid.className='cards';items.forEach(([icon,title,desc])=>{const card=document.createElement('article');card.className='card';card.innerHTML='<div class="icon">'+icon+'</div><h3></h3><p></p>';card.querySelector('h3').textContent=title;card.querySelector('p').textContent=desc;grid.append(card)});section.append(grid);root.append(section)});document.getElementById('ageBadge').textContent=monthLabel(month)}
function monthLabel(month){const d=new Date(2026,6+month,15);return `${month} month${month===1?'':'s'} (${d.toLocaleString('en-US',{month:'long'})})`}
const age=calculateAgeInMonths(BABY_BIRTHDAY);document.getElementById('currentAge').innerHTML=`Baby S is currently <strong>${monthLabel(age)}</strong><small>Birthday: July 15, 2026 · Age is calculated automatically from today’s date</small>`;render(age);
const select=document.getElementById('futureMonth');[2,3,4,5,6,9,12,18,24].forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=monthLabel(m);select.append(o)});select.value=String(age>=2&&[2,3,4,5,6,9,12,18,24].includes(age)?age:2);document.getElementById('showMonthBtn').onclick=()=>render(Number(select.value));
</script></body></html>
