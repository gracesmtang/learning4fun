<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infant Play Guide</title>
    <style>
      :root {
        --bg1: #fffaf2;
        --bg2: #ffeae2;
        --card: #ffffff;
        --primary: #f2654f;
        --secondary: #ffd88a;
        --text: #2e2e2e;
        --muted: #666666;
        --soft: #fff3ea;
        --border: #f2d7c5;
        --shadow: rgba(0, 0, 0, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }

      .hero,
      .results {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 12px 30px var(--shadow);
        padding: 28px 24px;
      }

      h1 {
        margin: 0;
        text-align: center;
        color: var(--primary);
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 10px 0 22px;
        font-size: 1.05rem;
      }

      .current-age {
        text-align: center;
        background: #fff3c9;
        border: 1px solid #efc86d;
        border-radius: 14px;
        padding: 16px;
        font-size: 1.2rem;
        font-weight: 700;
        color: #5b4a2b;
      }

      .current-age small {
        display: block;
        margin-top: 6px;
        font-size: 0.9rem;
        font-weight: 400;
      }

      .results {
        margin-top: 24px;
        background: var(--soft);
        box-shadow: none;
      }

      .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .results-header h2 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      .age-badge {
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--secondary);
        border: 1px solid #efc86d;
        font-weight: 700;
        color: #5b4a2b;
      }

      .selector-wrap {
        margin-top: 18px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .selector-wrap label {
        font-weight: 700;
        display: block;
        margin-bottom: 12px;
      }

      .selector-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      select,
      button {
        padding: 11px 12px;
        border-radius: 10px;
        font-size: 1rem;
      }

      select {
        min-width: 220px;
        border: 1px solid #d9c2b0;
      }

      button {
        background: var(--primary);
        color: white;
        border: 0;
        cursor: pointer;
      }

      .category {
        margin-top: 26px;
      }

      .category:first-child {
        margin-top: 0;
      }

      .category-title {
        color: var(--primary);
        margin: 0 0 12px;
        font-size: 1.35rem;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
      }

      .card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
      }

      .icon {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .card h3 {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 1.08rem;
      }

      .card p {
        margin: 0;
        line-height: 1.6;
      }

      .safety {
        margin-top: 24px;
        padding: 14px;
        background: #fff8dc;
        border: 1px solid #efd98d;
        border-radius: 12px;
        line-height: 1.5;
        color: #604f20;
      }

      @media (max-width: 600px) {
        .container {
          margin: 15px 8px;
          padding: 10px;
        }

        .hero,
        .results {
          padding: 22px 16px;
        }

        select,
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>Infant Play Guide</h1>
        <p class="subtitle">Age-appropriate play ideas for Baby S</p>
        <div id="currentAge" class="current-age"></div>
      </section>

      <section class="results">
        <div class="results-header">
          <h2>Suggested Activities</h2>
          <div id="ageBadge" class="age-badge"></div>
        </div>

        <div id="activities"></div>

        <div class="selector-wrap">
          <label for="futureMonth">View upcoming month:</label>
          <div class="selector-row">
            <select id="futureMonth"></select>
            <button id="showMonthBtn" type="button">Show Selected Month</button>
          </div>
        </div>

        <div class="safety">
          <strong>Safety reminder:</strong> Always supervise play. Keep small objects,
          paper, bubbles, and scents away from the mouth and eyes. Stop any activity if Baby S seems tired or uncomfortable.
        </div>
      </section>
    </main>

        const birth = new Date(`${dateString}T00:00:00`);
        const today = new Date();
        let months = (today.getFullYear() - birth.getFullYear()) * 12 + (today.getMonth() - birth.getMonth());
        if (today.getDate() < birth.getDate()) months -= 1;
        return Math.max(0, months);
      }

      function monthNameFromNumber(monthNumber) {
        const calendarDate = new Date(2026, 6 + monthNumber, 15);
        return calendarDate.toLocaleString("en-US", { month: "long" });
      }

      function renderPlan(plan) {
        const container = document.getElementById("activities");
        container.innerHTML = "";

        if (!plan || !plan.categories) {
          container.innerHTML = "<div class='empty'>No activities available for this month.</div>";
          return;
        }

        plan.categories.forEach((category) => {
          const section = document.createElement("section");
          section.className = "category";

          const title = document.createElement("h3");
          title.className = "category-title";
          title.textContent = category.name;
          section.appendChild(title);

          const cards = document.createElement("div");
          cards.className = "cards";

          category.items.forEach(([icon, heading, description]) => {
            const card = document.createElement("article");
            card.className = "card";

            const iconEl = document.createElement("div");
            iconEl.className = "icon";
            iconEl.textContent = icon || "✨";

            const titleEl = document.createElement("h3");
            titleEl.textContent = heading;

            const p = document.createElement("p");
            p.textContent = description;

            card.appendChild(iconEl);
            card.appendChild(titleEl);
            card.appendChild(p);
            cards.appendChild(card);
          });

          section.appendChild(cards);
          container.appendChild(section);
        });
      }

      const ageInMonths = calculateAgeInMonths(BABY_BIRTHDAY);
      const currentMonthLabel = `${ageInMonths} months (${monthNameFromNumber(ageInMonths)})`;
      document.getElementById("currentAge").innerHTML = `Baby S is currently <strong>${currentMonthLabel}</strong><small>Birthday: July 15, 2026 · Age is calculated automatically from today’s date</small>`;

      const select = document.getElementById("futureMonth");
      const months = [2, 3, 4, 5, 6, 7, 9, 12, 18, 24];

      months.forEach((month) => {
        const option = document.createElement("option");
        option.value = String(month);
        option.textContent = monthPlans[month]?.label || `${month} months`;
        select.appendChild(option);
      });

      const defaultMonth = months.includes(ageInMonths) ? ageInMonths : 2;
      select.value = String(defaultMonth);

      const defaultPlan = monthPlans[defaultMonth] || monthPlans[2];
      renderPlan(defaultPlan);
      document.getElementById("ageBadge").textContent = defaultPlan.label;

      document.getElementById("showMonthBtn").addEventListener("click", () => {
        const selected = Number(select.value);
        const plan = monthPlans[selected] || monthPlans[2];
        renderPlan(plan);
        document.getElementById("ageBadge").textContent = plan.label;
      });
    </script>
  </body>
</html>
