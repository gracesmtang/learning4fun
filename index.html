<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infant Play Guide</title>
  <style>
    :root { --bg1:#fffaf2; --bg2:#ffeae2; --primary:#f2654f; --soft:#fff3ea; --border:#f2d7c5; --text:#2e2e2e; --muted:#666; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:var(--text); }
    .container { max-width:1100px; margin:40px auto; padding:20px; }
    .hero,.results { background:#fff; border:1px solid var(--border); border-radius:20px; box-shadow:0 12px 30px rgba(0,0,0,.08); padding:28px 24px; }
    h1 { margin:0; text-align:center; color:var(--primary); font-size:clamp(2rem,4vw,3rem); }
    .subtitle { text-align:center; color:var(--muted); margin:10px 0 22px; font-size:1.05rem; }
    .current-age { text-align:center; background:#fff3c9; border:1px solid #efc86d; border-radius:14px; padding:16px; font-size:1.2rem; font-weight:bold; color:#5b4a2b; }
    .current-age small { display:block; margin-top:6px; font-size:.9rem; font-weight:normal; }
    .results { margin-top:24px; background:var(--soft); box-shadow:none; }
    .results-header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
    h2 { margin:0; font-size:clamp(1.5rem,2vw,2rem); }
    .age-badge { padding:8px 14px; border-radius:999px; background:#ffd88a; border:1px solid #efc86d; font-weight:bold; color:#5b4a2b; }
    .category { margin-top:26px; }
    .category:first-child { margin-top:0; }
    .category-title { color:var(--primary); margin:0 0 12px; font-size:1.35rem; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:0 8px 18px rgba(0,0,0,.03); }
    .icon { font-size:2rem; margin-bottom:10px; }
    .card h3 { margin:0 0 10px; color:var(--primary); font-size:1.1rem; }
    .card p { margin:0; line-height:1.6; }
    .safety { margin-top:24px; padding:14px 16px; background:#fff8dc; border:1px solid #efd98d; border-radius:12px; line-height:1.5; color:#604f20; }
    @media(max-width:600px){ .container{margin:15px 8px;padding:10px;} .hero,.results{padding:22px 16px;} }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>Infant Play Guide</h1>
      <p class="subtitle">Age-appropriate play ideas for Baby S</p>
      <div id="currentAge" class="current-age"></div>
    </section>

    <section class="results">
      <div class="results-header">
        <h2>Suggested Activities</h2>
        <div id="ageBadge" class="age-badge"></div>
      </div>
      <div id="activities"></div>
      <div class="safety"><strong>Safety reminder:</strong> Always supervise play. Keep small objects, paper, bubbles, and scents away from the mouth and eyes. Stop any activity if Baby S seems uncomfortable.</div>
    </section>
  </main>

  <script>
    // Baby S's birthday is fixed; no birthday input is needed.
    const BABY_BIRTHDAY = "2026-07-15";

    const monthTwoCategories = [
      {
        name: "🧠 Cognitive · 認知",
        items: [
          ["🪞", "Mirror Recognition · 鏡子認識初探", "Hold Baby S safely near a mirror and say, 'Who is that? It’s you!' Encourage eye contact and gentle smiling."],
          ["🐄", "Three Animal Sounds · 動物三聲音", "Make three simple sounds—cow moo, cat meow, and dog woof—repeating each a few times."],
          ["🍎", "Red Apple Card Match · 紅蘋果卡配物", "Show a red apple card beside a real apple and say, 'Same! Red!' Keep the object large and supervised."],
          ["🔔", "Rattle Disappears · 鈴聲再現", "Shake a rattle, hide it briefly, ask 'Where?', then reveal it and say, 'Here it is!'"],
          ["🤲", "Cause-and-Effect Rattle · 因果鈴遞手", "Shake the rattle for Baby S to hear, then offer it so they can try holding or shaking it."],
          ["👨‍👩‍👧", "Family Photo Connection · 家庭關係", "Point to a family photo and name people, such as 'Daddy loves you.'"],
          ["👶", "Body Parts · 身體部位", "Gently touch and name body parts: head, shoulders, tummy, hands, and feet."]
        ]
      },
      {
        name: "👁 Sensory · 感官刺激",
        items: [
          ["🤸", "Tummy Time 15 Minutes · TT 15計", "Offer supervised tummy time on a firm mat in short, comfortable periods that total about 15 minutes. Lie facing Baby S to encourage them."],
          ["🍃", "Balcony Breeze · 陽台微風感受", "With Baby S held securely, feel a gentle breeze and say, 'Cool! Breezy! Fresh!' Avoid direct sun and strong wind."],
          ["💦", "Bath Splash Kicks · 洗踢水濺水", "During a closely supervised bath, let Baby S gently kick the water and say, 'Kick! Splash!'"],
          ["🧸", "Hard, Soft, Rough Textures · 硬軟三質感", "Briefly present a large hard block, soft plush toy, and textured cloth for touch comparison. Do not let Baby S mouth unsafe items."],
          ["🍊", "Orange and Mint Scents · 橙皮薄荷香", "Keep orange peel or mint near—not touching—Baby S's nose for about three seconds. Stop if uncomfortable and avoid strong scents."],
          ["🥁", "Beat Tapping · 音節拍敲", "Hold Baby S's hand gently and tap a table softly to music, saying, 'Tap, tap, tap!'"],
          ["🌿", "Grass Foot Feel · 草地腳踩", "While holding Baby S securely, briefly let bare feet feel clean grass and describe it as soft or tickly."]
        ]
      },
      {
        name: "❤️ Emotional & Social · 情緒社交",
        items: [
          ["👏", "Clap Song · 拍手歌遊戲", "Gently hold Baby S's hands and clap together while singing a short clapping song."],
          ["🌟", "Praise Head Lifts · 讚賞抬頭嘗試", "When Baby S lifts their head during tummy time, smile and say, 'You did it! Amazing!'"],
          ["🤗", "Comfort First · 先說再抱安", "When Baby S cries, calmly say, 'Mama understands,' then provide a comforting cuddle."],
          ["😄", "Preference Test · 社交喜好測試", "Try three gentle engagement styles—singing, smiling, and talking—and notice which gets the biggest response."],
          ["🔁", "Imitation Game · 模仿遊戲開始", "If Baby S pats or makes a sound, copy it gently. This teaches turn-taking and connection."],
          ["🙂", "Name Mirror Emotions · 鏡緒命名", "In a mirror, make gentle happy, surprised, and calm expressions and name each feeling."],
          ["🎼", "Family Sing-Along · 全家大合唱", "Invite family members to sing a favourite gentle song together."]
        ]
      },
      {
        name: "🏃 Gross Motor · 大肌肉",
        items: [
          ["🔔", "Reach for Hanging Toy · 掛物伸手", "Place a safe toy above Baby S's chest, within comfortable reach, and encourage reaching. Never leave a hanging toy unattended."],
          ["🦵", "Supported Standing · 扶腋下腿踩站", "With full support under the arms, let Baby S's feet briefly touch your thighs for up to 15 seconds. Do not force standing."],
          ["↔️", "Roll Induction · 翻身誘導", "Place Baby S on their side and use a toy on the opposite side to encourage looking and gentle rolling. Stop if frustrated."],
          ["⚽", "Kick a Soft Ball · 踢軟球", "While Baby S lies on their back, place a soft ball near the feet and encourage gentle kicking."],
          ["💪", "Elbow Prop · 俯臥雙肘撐", "During tummy time, encourage Baby S to prop on both elbows for a few seconds with close supervision."],
          ["🟠", "Slow Ball Side Roll · 大球左右慢動", "Only with confident adult support, place Baby S prone on a large stable ball and make very slow side-to-side movements."],
          ["🚗", "Park Watch · 園看人看車", "Take a stroller walk and talk about people, children, and vehicles from a safe distance."]
        ]
      },
      {
        name: "✋ Fine Motor · 細肌肉",
        items: [
          ["🔔", "Two Rattles · 雙手各握鈴", "Offer one lightweight, baby-safe rattle at a time to each hand and observe whether Baby S holds or moves both."],
          ["🤲", "Hand Transfer · 玩具左至右換手", "Place a safe toy in the left hand, wait, and gently encourage Baby S to explore moving it toward the right hand."],
          ["👃", "Point to Face · 食指點鼻眼", "With your guidance, gently touch and name nose, eyes, and mouth. Never poke or put fingers near the eyes."],
          ["🔊", "Animal Sound Button · 聲動物按鈕", "Use a large, safe sound book or button and name the animal each time it sounds, such as 'Dog! Dog!'"],
          ["📄", "Tear Paper Introduction · 大紙撕開初探", "Let Baby S explore tearing a large sheet of paper only with close supervision; remove every piece immediately."],
          ["🫧", "Pop Palm Bubbles · 手掌泡泡戳破", "Blow bubbles toward an adult-held palm so Baby S can watch or touch them. Keep bubbles away from eyes and mouth."],
          ["👏", "Family Clap Relay · 家庭接力拍手", "Take turns clapping—dad, mum, grandparent—and invite Baby S to watch and imitate."]
        ]
      }
    ];

    const otherActivities = {
      0: [{icon:"😊",title:"Face-to-Face Smiles",description:"Hold Baby S close, smile, and talk softly to support bonding and early communication."},{icon:"🎵",title:"Soft Music Time",description:"Play a gentle lullaby or hum to encourage listening and calm connection."},{icon:"🧸",title:"Tummy Time with a Mirror",description:"Use a safe mirror during supervised tummy time to strengthen neck and shoulder muscles."}],
      3: [{icon:"🧸",title:"Tummy Time with Toys",description:"Place bright toys in front of Baby S to encourage head control and visual tracking."},{icon:"🔔",title:"Rattle Play",description:"Shake a soft rattle near one side to encourage turning toward sounds."},{icon:"👀",title:"Social Coos and Faces",description:"Smile, mimic sounds, and respond to coos to build communication and connection."}],
      6: [{icon:"🙈",title:"Peek-a-Boo",description:"Cover your face and reveal it with a smile to support social play and anticipation."},{icon:"🧣",title:"Texture Exploration",description:"Let Baby S touch soft and textured cloths to develop sensory awareness."},{icon:"⚽",title:"Soft Ball Roll",description:"Roll a soft ball between you and Baby S to encourage tracking and reaching."}],
      9: [{icon:"🧱",title:"Stacking Soft Blocks",description:"Offer soft blocks or cups to stack and knock down, supporting coordination and problem solving."},{icon:"🎶",title:"Clapping to Music",description:"Sing songs and clap together to encourage rhythm and movement."},{icon:"🧩",title:"Crawling Toy Chase",description:"Place a favourite toy just out of reach to encourage crawling and exploration."}],
      12: [{icon:"🕵️",title:"Hide-and-Seek with Objects",description:"Hide a toy under a cloth and let Baby S find it to support early thinking."},{icon:"📚",title:"Picture Book Time",description:"Point to pictures and name objects to build vocabulary and attention."},{icon:"💃",title:"Nursery Rhyme Movement",description:"Dance gently and clap along to improve rhythm and coordination."}],
      18: [{icon:"🎲",title:"Sorting Colors and Shapes",description:"Use large blocks or sorting toys to build early thinking and fine motor skills."},{icon:"🚲",title:"Push-and-Pull Toy Play",description:"Use a push toy to encourage standing, stepping, and mobility confidence."},{icon:"🍼",title:"Pretend Play Feeding",description:"Role-play with a stuffed animal or doll to develop imagination and social understanding."}],
      24: [{icon:"🧩",title:"Shape Sorting Games",description:"Use large shape sorters or simple puzzles for problem-solving and hand control."},{icon:"📦",title:"Follow Simple Instructions",description:"Give fun commands such as 'find the ball' to support listening and communication."},{icon:"⚽",title:"Ball Games",description:"Kick, roll, or throw a soft ball together to improve coordination and balance."}]
    };

    function calculateAgeInMonths(dateString) {
      const birth = new Date(`${dateString}T00:00:00`);
      const today = new Date();
      let months = (today.getFullYear() - birth.getFullYear()) * 12 + today.getMonth() - birth.getMonth();
      if (today.getDate() < birth.getDate()) months--;
      return Math.max(0, months);
    }

    function cardGrid(items) {
      const grid = document.createElement('div');
      grid.className = 'cards';
      items.forEach(([icon, title, description]) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<div class="icon">${icon}</div><h3></h3><p></p>`;
        card.querySelector('h3').textContent = title;
        card.querySelector('p').textContent = description;
        grid.appendChild(card);
      });
      return grid;
    }

    function displayMonthTwo() {
      const container = document.getElementById('activities');
      monthTwoCategories.forEach(category => {
        const section = document.createElement('section');
        section.className = 'category';
        const heading = document.createElement('h3');
        heading.className = 'category-title';
        heading.textContent = category.name;
        section.appendChild(heading);
        section.appendChild(cardGrid(category.items));
        container.appendChild(section);
      });
    }

    function displayOtherMonth(items) {
      const container = document.getElementById('activities');
      const section = document.createElement('section');
      section.className = 'category';
      section.appendChild(cardGrid(items.map(item => [item.icon, item.title, item.description])));
      container.appendChild(section);
    }

    const ageInMonths = calculateAgeInMonths(BABY_BIRTHDAY);
    document.getElementById('currentAge').innerHTML = `Baby S is currently <strong>${ageInMonths} month${ageInMonths === 1 ? '' : 's'} old</strong><small>Birthday: July 15, 2026 · Age is calculated automatically from today's date</small>`;
    document.getElementById('ageBadge').textContent = `${ageInMonths} months`;
    if (ageInMonths === 2) displayMonthTwo();
    else {
      const keys = Object.keys(otherActivities).map(Number).filter(key => key <= ageInMonths);
      const closest = keys.length ? Math.max(...keys) : 0;
      displayOtherMonth(otherActivities[closest]);
    }
  </script>
</body>
</html>
